<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="cart.css">
    <title>Shopping Cart - Echo</title>
</head>
<body>
    <div class="TitleDiv fade-in">
        <a href="index.html"><p class="Title">Echo</p></a>
        <div class="icons">
            <a href="Items.html"><p>Items</p></a>
            <a href="About.html"><p>About</p></a>
            <a href="cart.html" class="cart-icon-link">
                <p class="cart-icon">🛒</p>
                <span class="cart-count-badge" id="cartCountBadge"></span>
            </a>
        </div>
    </div>

    <div class="cart-wrapper fade-in">
        <h1 class="cart-title">Your Shopping Cart</h1>
        
        <div class="cart-container">
            <div class="cart-items" id="cartItemsContainer">
                <!-- Cart items will be dynamically inserted here -->
                <div class="loading-message">Loading your cart...</div>
            </div>
            
            <div class="cart-summary" id="cartSummary">
                <h3>Order Summary</h3>
                <div class="summary-row">
                    <span>Subtotal</span>
                    <span id="subtotal">0 DA</span>
                </div>
                <div class="summary-row">
                    <span>Shipping</span>
                    <span id="shipping">Free</span>
                </div>
                <div class="summary-row total">
                    <span>Total</span>
                    <span id="total">0 DA</span>
                </div>
                <button class="checkout-btn" id="checkoutBtn">Proceed to Checkout</button>
                <button class="continue-shopping-btn" id="continueShoppingBtn">Continue Shopping</button>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="footer-left">
            <h3 class="footer-brand">Echo</h3>
            <p class="footer-description">
                Echo is more than clothing—it's self-expression that resonates. 
                Wear what speaks for you, not what fades away.
            </p>
        </div>
        <div class="footer-right">
            <h4 class="footer-title">Quick Links</h4>
            <ul class="footer-links">
                <li><a href="Items.html">Items</a></li>
                <li><a href="About.html">About</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </div>
    </div>

    <script src="cart.js"></script>
</body>
</html>
